name: Validate Klippain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install template test dependency
        run: python -m pip install -r tests/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate probe framework
        run: python scripts/validate_probe_framework.py
      - name: Test installer MCU templates
        run: bash tests/install_mcu_templates_test.sh
