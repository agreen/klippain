# 3dp-04 only: Voron 2.4 300mm, Voron Tap.
# Merge into user-owned overrides.cfg, or copy beside it and include it last.
# This is an overlay, not a replacement for the printer's existing overrides.

[gcode_macro _USER_VARIABLES]
variable_startprint_pre_actions: "clear_skew", "set_active_thermals"

# Upstream Tap order, replacing tilt_calib with qgl_fine and loading skew last.
# Reconcile any additional existing printer actions before installation.
variable_startprint_actions: "smart_bed_soak", "extruder_preheating", "chamber_soak", "clean", "qgl_fine", "z_offset", "bedmesh", "extruder_heating", "purge_blob", "clean", "primeline", "load_skew"
variable_endprint_actions: "clear_skew", "park", "wait_moves", "clear_bed_mesh", "retract_filament", "turn_off_heaters", "turn_off_fans", "turn_off_motors", "reset_limits", "set_idle_thermals", "finalize"
variable_cancelprint_actions: "clear_skew", "park", "retract_filament", "turn_off_heaters", "turn_off_fans", "wait_moves", "clear_pause", "clear_bed_mesh", "reset_sdcard", "set_idle_thermals", "finalize", "base_cancel"
variable_park_lift_z: 50
variable_park_position_xy: 150,10
gcode:

[gcode_macro _START_PRINT_PRE_ACTION_CLEAR_SKEW]
gcode:
    SET_SKEW CLEAR=1

[gcode_macro _END_PRINT_ACTION_CLEAR_SKEW]
gcode:
    SET_SKEW CLEAR=1

[gcode_macro _CANCEL_PRINT_ACTION_CLEAR_SKEW]
gcode:
    SET_SKEW CLEAR=1

[gcode_macro _START_PRINT_ACTION_LOAD_SKEW]
gcode:
    SKEW_PROFILE LOAD=calilantern_skew_profile

[gcode_macro QGL_FINE]
description: Two-pass QGL for 3dp-04 using Voron Tap
gcode:
    # Call Klippain's existing wrapper, keeping its probe and acceleration handling.
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=30 SAMPLES=1 RETRIES=0
    _QGL_FINE_FINISH

[gcode_macro _QGL_FINE_FINISH]
gcode:
    # No sampling/tolerance/retry overrides here: use normal configured values.
    {% if printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3
    {% else %}
        {action_raise_error("Coarse QGL did not complete successfully")}
    {% endif %}

[gcode_macro _START_PRINT_ACTION_QGL_FINE]
gcode:
    # Preserve Klippain's ordinary already-leveled/force-homing behavior.
    {% set force_homing = printer["gcode_macro _USER_VARIABLES"].force_homing_in_start_print %}
    {% if not printer.quad_gantry_level.applied or force_homing %}
        QGL_FINE
    {% endif %}
