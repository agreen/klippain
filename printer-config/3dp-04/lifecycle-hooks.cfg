# 3dp-04 lifecycle hooks. Include this from the user-owned overrides.cfg.

[gcode_macro _USER_VARIABLES]
variable_startprint_pre_actions: ["clear_skew"]
variable_endprint_pre_park_actions: ["clear_skew"]
variable_cancelprint_pre_park_actions: ["clear_skew"]
gcode:

[gcode_macro _START_PRINT_PRE_ACTION_CLEAR_SKEW]
gcode:
    SET_SKEW CLEAR=1

[gcode_macro _END_PRINT_PRE_PARK_ACTION_CLEAR_SKEW]
gcode:
    SET_SKEW CLEAR=1

[gcode_macro _CANCEL_PRINT_PRE_PARK_ACTION_CLEAR_SKEW]
gcode:
    SET_SKEW CLEAR=1
