# 3dp-04 thermal policy. Install as klippain-thermal-management.cfg and include
# it from printer.cfg in place of electronics_enclosure_fan.cfg.

# Track recent chamber temperature so consecutive enclosed-material jobs can
# skip a redundant timed soak. History starts fresh after a Klipper restart.
[temp_tracker chamber_soak]
sensor: Chamber
period: 600

# Preserve the existing combined electronics temperature for monitoring.
[temperature_sensor electronics_max]
sensor_type: temperature_combined
sensor_list: temperature_sensor Electrical_Cabinet, temperature_sensor mcu
combination_method: max
min_temp: 0
max_temp: 100
maximum_deviation: 999.99

# Native Klipper controller-fan behavior: full active airflow followed by five
# minutes at a quieter cooldown speed after the watched heaters/drivers stop.
[controller_fan electronics_fan]
pin: CONTROLLER_FAN
max_power: 0.8
off_below: 0.24
kick_start_time: 0.5
fan_speed: 0.8
idle_speed: 0.3
idle_timeout: 300
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3, extruder

# Merge with Klippain's base rpi_fan definition. The idle target is deliberately
# above the Pi's ordinary idle temperature to prevent repeated start/stop noise.
[temperature_fan rpi_fan]
max_speed: 0.60
target_temp: 55
max_delta: 3

[gcode_macro _USER_VARIABLES]
variable_material_soak_minutes: {"PLA": 0, "PETG": 0, "ABS": 8, "ASA": 8, "TPU": 0}
variable_smart_soak_chamber_margin: 5
gcode:

[gcode_macro _START_PRINT_ACTION_SMART_BED_SOAK]
description: Material-aware bed soak using recent average chamber temperature
gcode:
    {% set start = printer["gcode_macro START_PRINT"] %}
    {% set user = printer["gcode_macro _USER_VARIABLES"] %}
    {% set material = start.material|string|upper %}
    {% set bed_temp = start.bed_temp|float %}
    {% set chamber_temp = start.chamber_temp|float %}
    {% set policies = user.material_soak_minutes %}
    {% set configured_soak = policies.get(material, 0)|int %}
    {% set soak = params.SOAK|default(configured_soak)|int %}
    {% set force_soak = params.FORCE_SOAK|default(0)|int %}
    {% set chamber_margin = user.smart_soak_chamber_margin|float %}
    {% set warm_threshold = chamber_temp - chamber_margin %}
    {% set chamber_average = printer["temp_tracker chamber_soak"].average|float %}
    {% set already_warm = chamber_temp > 0 and chamber_average >= warm_threshold %}
    {% set status_leds = user.status_leds_control_enabled|default(False) %}
    {% set filter_enabled = user.filter_enabled %}
    {% set travel_speed = user.travel_speed|float * 60 %}
    {% set max_x = printer.toolhead.axis_maximum.x|float %}
    {% set max_y = printer.toolhead.axis_maximum.y|float %}

    {% if status_leds %}
        STATUS_LEDS COLOR="HEATING"
    {% endif %}

    {% if soak <= 0 %}
        RESPOND MSG="Smart soak: {material} does not require a timed soak"
        HEATSOAK_BED TEMP={bed_temp} SOAKTIME=0
    {% elif already_warm and not force_soak %}
        RESPOND MSG="Smart soak: recent chamber average {chamber_average|round(1)}C is at least {warm_threshold|round(1)}C; timed soak skipped"
        HEATSOAK_BED TEMP={bed_temp} SOAKTIME=0
    {% else %}
        {% if force_soak %}
            RESPOND MSG="Smart soak: forcing {soak} minutes for {material}"
        {% else %}
            RESPOND MSG="Smart soak: recent chamber average {chamber_average|round(1)}C is below {warm_threshold|round(1)}C; soaking {soak} minutes"
        {% endif %}
        {% if chamber_temp > 0 and filter_enabled %}
            START_FILTER SPEED=1
        {% endif %}
        G0 X{max_x|int / 2} Y{max_y|int / 3} Z50 F{travel_speed}
        HEATSOAK_BED TEMP={bed_temp} SOAKTIME={soak}
    {% endif %}

[gcode_macro _START_PRINT_PRE_ACTION_SET_ACTIVE_THERMALS]
gcode:
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=rpi_fan TARGET=47 MAX_SPEED=0.60

[gcode_macro _END_PRINT_ACTION_SET_IDLE_THERMALS]
gcode:
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=rpi_fan TARGET=55 MAX_SPEED=0.60

[gcode_macro _CANCEL_PRINT_ACTION_SET_IDLE_THERMALS]
gcode:
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=rpi_fan TARGET=55 MAX_SPEED=0.60
